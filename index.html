<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#dfeeff">
<title>MAX</title>
<style>
  :root{ --u: calc(min(100vw, 480px) / 720); }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    font-family: Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #dcecff 0%, #eaf3ff 38%, #f8fbff 70%, #ffffff 100%);
    background-attachment: fixed;
    color:#111;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  .screen{ position:relative; width:100%; height:100dvh; min-height:100%; display:flex; justify-content:center; align-items:center; }
  .stage{ position:relative; width:calc(var(--u)*720); height:calc(var(--u)*915); }
  .abs{ position:absolute; }
  .globe{ position:fixed; left:calc(var(--u)*25); top:calc(var(--u)*44); width:calc(var(--u)*28); height:calc(var(--u)*28); }
  .globe svg{ width:100%; height:100%; display:block; }

  .brand{ left:0; right:0; top:calc(var(--u)*181); height:calc(var(--u)*64); display:flex; justify-content:center; align-items:center; gap:calc(var(--u)*16); padding-right:calc(var(--u)*6); }
  .brand img{ width:calc(var(--u)*54); height:auto; display:block; }
  .brand .word{ font-family:"Montserrat","Poppins","Nunito","Arial Rounded MT Bold","Segoe UI",sans-serif; font-weight:700; font-size:calc(var(--u)*50); letter-spacing:calc(var(--u)*1); color:#16161a; line-height:1; text-transform:lowercase; transform:translateY(calc(var(--u)*-1)); }

  h1{ left:0; right:0; top:calc(var(--u)*336); text-align:center; font-size:calc(var(--u)*26); font-weight:700; line-height:calc(var(--u)*34); color:#0f0f12; }
  .sub{ left:0; right:0; top:calc(var(--u)*377); text-align:center; font-size:calc(var(--u)*19); line-height:calc(var(--u)*28); color:#8b9099; }

  .field{ left:calc(var(--u)*140); top:calc(var(--u)*437); width:calc(var(--u)*470); height:calc(var(--u)*68); border-radius:calc(var(--u)*20); background:#e8ebef; display:flex; align-items:center; }
  .flagbtn{ display:flex; align-items:center; height:100%; padding-left:calc(var(--u)*17); cursor:pointer; }
  .flag{ font-size:calc(var(--u)*25); line-height:1; font-family:'Apple Color Emoji','Noto Color Emoji','Segoe UI Emoji',sans-serif; width:calc(var(--u)*28); text-align:center; }
  .code{ margin-left:calc(var(--u)*8); font-size:calc(var(--u)*23); color:#17171a; font-weight:400; }
  .chev{ margin-left:calc(var(--u)*7); width:calc(var(--u)*16); height:calc(var(--u)*16); }
  .field input{ flex:1; min-width:0; height:100%; border:0; outline:0; background:transparent; font-family:inherit; font-size:calc(var(--u)*23); color:#17171a; margin-left:calc(var(--u)*18); padding:0; -webkit-user-select:text; user-select:text; caret-color:#2d8cf0; }
  .field input::placeholder{ color:#8e939b; opacity:1; }

  .hint{ left:calc(var(--u)*156); top:calc(var(--u)*511); width:calc(var(--u)*430); font-size:calc(var(--u)*17.5); line-height:calc(var(--u)*23); color:#868b94; }
  .hint.err{ color:#e5262b; }

  .btn{ left:calc(var(--u)*140); top:calc(var(--u)*588); width:calc(var(--u)*470); height:calc(var(--u)*67); border:0; border-radius:calc(var(--u)*20); background:#80bbff; color:#fff; font-family:inherit; font-size:calc(var(--u)*23); font-weight:500; display:flex; align-items:center; justify-content:center; cursor:default; transition:background .15s; }
  .btn.on{ background:#2c8cf2; cursor:pointer; }
  .btn.on:active{ background:#2178d6; }
  .btn.busy{ pointer-events:none; }

  .consent{ left:calc(var(--u)*100); right:calc(var(--u)*100); top:calc(var(--u)*681); text-align:center; font-size:calc(var(--u)*17.5); line-height:calc(var(--u)*21.5); color:#7b8089; }
  .consent b{ font-weight:500; color:#1a1a1d; }

  .link{ left:50%; transform:translateX(-50%); font-family:inherit; border:0; background:transparent; color:#2d8cf0; font-size:calc(var(--u)*21); font-weight:700; white-space:nowrap; padding:calc(var(--u)*12) calc(var(--u)*22); border-radius:calc(var(--u)*16); cursor:pointer; }
  .link:active{ background:rgba(45,140,240,.18); }
  #qr{ top:calc(var(--u)*754); }
  #help{ top:calc(var(--u)*817); }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity .22s; z-index:20; }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .sheet{ position:fixed; left:50%; bottom:0; width:min(100vw,480px); max-height:78dvh; background:#fff; border-radius:calc(var(--u)*40) calc(var(--u)*40) 0 0; transform:translate(-50%,105%); transition:transform .26s cubic-bezier(.2,.8,.2,1); z-index:21; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom,0px); }
  .sheet.open{ transform:translate(-50%,0); }
  .grab{ width:calc(var(--u)*56); height:calc(var(--u)*6); border-radius:99px; background:#d3d6db; margin:calc(var(--u)*16) auto calc(var(--u)*6); flex:none; }
  .sheet h2{ flex:none; font-size:calc(var(--u)*30); font-weight:700; padding:calc(var(--u)*14) calc(var(--u)*36) calc(var(--u)*16); color:#0f0f12; }
  .list{ overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:calc(var(--u)*20); }
  .row{ display:flex; align-items:center; min-height:calc(var(--u)*92); padding:calc(var(--u)*10) calc(var(--u)*36); cursor:pointer; }
  .row:active{ background:rgba(45,140,240,.12); }
  .row .rf{ font-size:calc(var(--u)*38); line-height:1; width:calc(var(--u)*56); font-family:'Apple Color Emoji','Noto Color Emoji','Segoe UI Emoji',sans-serif; }
  .row .rn{ flex:1; font-size:calc(var(--u)*24); color:#111; margin-left:calc(var(--u)*14); line-height:calc(var(--u)*30); }
  .row .rc{ font-size:calc(var(--u)*23); color:#8b9099; margin-left:calc(var(--u)*12); }
  .row .ck{ width:calc(var(--u)*28); height:calc(var(--u)*28); margin-left:calc(var(--u)*14); flex:none; visibility:hidden; }
  .row.sel .ck{ visibility:visible; }
</style>
</head>

    <h1 class="abs">С каким номером телефона хотите войти?</h1>
    <div class="abs sub">На него придёт СМС с кодом</div>

    <div class="abs field">
      <div class="flagbtn" id="flag">
        <span class="flag" id="curflag">🇷🇺</span>
        <span class="code" id="curcode">+7</span>
        <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="#55595f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.8l5 5 5-5"/></svg>
      </div>
      <input id="phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="123 456 78 90" maxlength="16">
    </div>

    <div class="abs hint" id="hint">Для входа нужен номер из России или страны из списка — нажмите на флаг, чтобы выбрать</div>

    <button class="abs btn" id="go" type="button">Продолжить</button>

    <div class="abs consent">Нажимая «Продолжить», вы принимаете <b>политику конфиденциальности</b> и <b>пользовательское соглашение</b></div>

    <button class="abs link" id="qr" type="button">Войти по QR-коду</button>
    <button class="abs link" id="help" type="button">Нужна помощь?</button>
  </div>
</div>

<div class="overlay" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Выберите страну">
  <div class="grab"></div>
  <h2>Выберите страну</h2>
  <div class="list" id="list"></div>
</div>

<script>
(function(){
  var C = [
    ['RU','Россия','7'],['AZ','Азербайджан','994'],['AM','Армения','374'],['AF','Афганистан','93'],
    ['BY','Беларусь','375'],['BO','Боливия','591'],['BR','Бразилия','55'],['VE','Венесуэла','58'],
    ['VN','Вьетнам','84'],['GM','Гамбия','220'],['GD','Гренада','1473'],['GE','Грузия','995'],
    ['CD','Демократическая Республика Конго','243'],['EG','Египет','20'],['IN','Индия','91'],
    ['ID','Индонезия','62'],['IQ','Ирак','964'],['KZ','Казахстан','7'],['KH','Камбоджа','855'],
    ['QA','Катар','974'],['CN','Китай','86'],['CO','Колумбия','57'],['CU','Куба','53'],
    ['KW','Кувейт','965'],['KG','Кыргызстан','996'],['LA','Лаос','856'],['LB','Ливан','961'],
    ['MY','Малайзия','60'],['MD','Молдова','373'],['MM','Мьянма','95'],['NI','Никарагуа','505'],
    ['AE','ОАЭ','971'],['PK','Пакистан','92'],['PW','Палау','680'],['CG','Республика Конго','242'],
    ['SA','Саудовская Аравия','966'],['KN','Сент-Китс и Невис','1869'],['TJ','Таджикистан','992'],
    ['TH','Таиланд','66'],['TZ','Танзания','255'],['TM','Туркменистан','993'],['TR','Турция','90'],
    ['UZ','Узбекистан','998'],['ZA','ЮАР','27']
  ];
  function flag(cc){ return String.fromCodePoint.apply(null, cc.split('').map(function(c){ return 127397 + c.charCodeAt(0); })); }

  var phone = document.getElementById('phone');
  var go = document.getElementById('go');
  var hint = document.getElementById('hint');
  var orig = hint.textContent;
  var cur = C[0];
  var prevDigits = '', prevRaw = '';

  function fmt(d){
    if (d.length < 3) return d;
    var r = '(' + d.slice(0,3) + ')';
    if (d.length > 3) r += ' ' + d.slice(3,6);
    if (d.length > 6) r += ' ' + d.slice(6,8);
    if (d.length > 8) r += '-' + d.slice(8,10);
    return r;
  }
  function need(){ return cur[2] === '7' ? 10 : 7; }
  function refresh(){
    go.classList.toggle('on', prevDigits.length >= need());
    hint.textContent = orig;
    hint.classList.remove('err');
  }

  phone.addEventListener('input', function(){
    var raw = phone.value;
    var d = raw.replace(/\D/g,'').slice(0,10);
    // удалили только символ оформления "(", ")", " " или "-" — стираем и последнюю цифру
    if (raw.length < prevRaw.length && d.length === prevDigits.length) d = d.slice(0,-1);
    prevDigits = d;
    phone.value = prevRaw = fmt(d);
    refresh();
  });

  // список стран
  var list = document.getElementById('list');
  var ov = document.getElementById('ov');
  var sheet = document.getElementById('sheet');
  var check = '<svg class="ck" viewBox="0 0 28 28" fill="none" stroke="#2d8cf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14.5l6 6L23 8"/></svg>';
  function build(){
    list.innerHTML = '';
    C.forEach(function(c){
      var r = document.createElement('div');
      r.className = 'row' + (c === cur ? ' sel' : '');
      r.innerHTML = '<span class="rf">'+flag(c[0])+'</span><span class="rn">'+c[1]+'</span><span class="rc">+'+c[2]+'</span>'+check;
      r.addEventListener('click', function(){ cur = c; setCountry(); close(); });
      list.appendChild(r);
    });
  }
  function setCountry(){
    document.getElementById('curflag').textContent = flag(cur[0]);
    document.getElementById('curcode').textContent = '+' + cur[2];
    refresh();
  }
  function open(){ build(); ov.classList.add('open'); sheet.classList.add('open'); phone.blur(); }
  function close(){ ov.classList.remove('open'); sheet.classList.remove('open'); }
  document.getElementById('flag').addEventListener('click', open);
  ov.addEventListener('click', close);

  go.addEventListener('click', function(){
    if (!go.classList.contains('on')) return;
    go.classList.add('busy');
    phone.blur();
    setTimeout(function(){
      hint.textContent = 'Проверьте подключение к сети';
      hint.classList.add('err');
      go.classList.remove('busy');
    }, 600);
  });

  // Заглушки: кнопки нажимаются (подсветка), но ничего не делают
  ['qr','help'].forEach(function(id){
    document.getElementById(id).addEventListener('click', function(e){ e.preventDefault(); });
  });
})();
</script>
</body>
</html>
